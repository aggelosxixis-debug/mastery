op:12px;background:linear-gradient(90deg,#744139,var(--gold));font-weight:bold;text-transform:uppercase}.note{text-align:center;color:var(--muted);font-size:13px;margin:14px}.complete{color:var(--ok);text-align:center;font-weight:bold;margin-top:12px}.locked{opacity:.48}</style></head><body><main class="app"><header><h1>Mastery Protocol</h1><p>60 ημέρες — Πειθαρχία. Στρατηγική. Ηγεσία.</p></header><section class="box"><div class="row"><span id="progressText"></span><span id="percent"></span></div><div class="track"><div class="fill" id="fill"></div></div></section><div class="nav"><button id="back">← Πίσω</button><select id="select"></select><button id="next">Επόμενο →</button></div><article class="card" id="card"><span class="tag" id="phase"></span><div class="row" style="margin-top:10px"><span id="day"></span></div><h2 id="focus"></h2><div class="block"><div class="label">Μάθηση / Αρχή</div><div class="text" id="task"></div></div><div class="block"><div class="label">Πρακτική άσκηση</div><div class="text" id="exercise"></div></div><div class="block"><div class="label">Ηθικό πλαίσιο</div><div class="text" id="why"></div></div><div class="block"><div class="label">Ολοκλήρωσε πριν προχωρήσεις</div><label class="check"><input type="checkbox" data-i="0"><span>Μελέτησα το σημερινό σημείο</span></label><label class="check"><input type="checkbox" data-i="1"><span>Έκανα την πρακτική άσκηση</span></label><label class="check"><input type="checkbox" data-i="2"><span>Κατέγραψα μία παρατήρηση στο ημερολόγιο</span></label></div><button class="finish" id="finish" disabled>Ολοκλήρωση & επόμενη μέρα</button><div class="complete" id="complete"></div></article><p class="note">Η πρόοδος αποθηκεύεται τοπικά στη συσκευή σου. <a href="#" id="reset" style="color:var(--muted)">Επαναφορά</a></p></main><script>const DAYS=[{"day":1,"phase":"Θεμέλια","focus":"Σιωπή με πρόθεση","task":"Παρατήρησε αντί να απαντάς αμέσως.","exercise":"Κράτησε τρεις παύσεις πριν απαντήσεις σε σημαντικές συζητήσεις
