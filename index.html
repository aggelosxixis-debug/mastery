<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mastery — 60 Day Protocol</title><style>:root{--bg:#0b0d10;--panel:#15191f;--ink:#edf2f4;--muted:#a4adb8;--gold:#d1a954;--ok:#4da76e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#222832,#0b0d10 52%);color:var(--ink);font:16px Arial,sans-serif;padding:18px}.app{max-width:760px;margin:auto}header{text-align:center;margin:18px 0}h1{margin:0;color:var(--gold);letter-spacing:2px;text-transform:uppercase;font:700 26px Georgia,serif}header p{color:var(--muted);margin:8px}.box,.card{background:var(--panel);border:1px solid #29313b;border-radius:14px;padding:18px;margin-bottom:15px}.row{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}.track{height:10px;background:#29313b;border-radius:8px;overflow:hidden;margin-top:10px}.fill{height:100%;background:linear-gradient(90deg,#744139,var(--gold));transition:.35s}.nav{display:flex;gap:8px;justify-content:center;margin:14px 0}button,select{background:#1b212a;color:var(--ink);border:1px solid #384452;border-radius:8px;padding:10px 12px;font-size:14px}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.tag{display:inline-block;color:var(--gold);border:1px solid var(--gold);border-radius:16px;padding:4px 9px;font-size:12px;text-transform:uppercase;letter-spacing:1px}h2{margin:8px 0 18px;font:700 23px Georgia,serif}.block{margin:17px 0}.label{color:var(--gold);font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-bottom:7px}.text{line-height:1.55}.check{display:flex;gap:10px;margin:9px 0;padding:11px;border:1px solid #303945;background:#1b212a;border-radius:9px}.check.done{border-color:var(--ok);background:#15251b;text-decoration:line-through;color:var(--muted)}input{accent-color:var(--gold);width:18px;height:18px}.finish{width:100%;margin-top:12px;background:linear-gradient(90deg,#744139,var(--gold));font-weight:bold;text-transform:uppercase}.note{text-align:center;color:var(--muted);font-size:13px;margin:14px}.complete{color:var(--ok);text-align:center;font-weight:bold;margin-top:12px}.locked{opacity:.48}</style></head><body><main class="app"><header><h1>Mastery Protocol</h1><p>60 ημέρες — Πειθαρχία. Στρατηγική. Ηγεσία.</p></header><section class="box"><div class="row"><span id="progressText"></span><span id="percent"></span></div><div class="track"><div class="fill" id="fill"></div></div></section><div class="nav"><button id="back">← Πίσω</button><select id="select"></select><button id="next">Επόμενο →</button></div><article class="card" id="card"><span class="tag" id="phase"></span><div class="row" style="margin-top:10px"><span id="day"></span></div><h2 id="focus"></h2><div class="block"><div class="label">Μάθηση / Αρχή</div><div class="text" id="task"></div></div><div class="block"><div class="label">Πρακτική άσκηση</div><div class="text" id="exercise"></div></div><div class="block"><div class="label">Ηθικό πλαίσιο</div><div class="text" id="why"></div></div><div class="block"><div class="label">Ολοκλήρωσε πριν προχωρήσεις</div><label class="check"><input type="checkbox" data-i="0"><span>Μελέτησα το σημερινό σημείο</span></label><label class="check"><input type="checkbox" data-i="1"><span>Έκανα την πρακτική άσκηση</span></label><label class="check"><input type="checkbox" data-i="2"><span>Κατέγραψα μία παρατήρηση στο ημερολόγιο</span></label></div><button class="finish" id="finish" disabled>Ολοκλήρωση & επόμενη μέρα</button><div class="complete" id="complete"></div></article><p class="note">Η πρόοδος αποθηκεύεται τοπικά στη συσκευή σου. <a href="#" id="reset" style="color:var(--muted)">Επαναφορά</a></p></main><script>const DAYS=__DAYS__;const K='mastery_protocol_v1';let s=JSON.parse(localStorage.getItem(K)||'{"done":{},"checks":{}}');let cur=1;const $=id=>document.getElementById(id);function locked(d){return d>1&&!s.done[d-1]}function max(){let d=1;while(s.done[d]&&d<DAYS.length)d++;return d}function save(){localStorage.setItem(K,JSON.stringify(s))}function labels(){[...$('select').options].forEach((o,i)=>{let d=i+1;o.textContent='Ημέρα '+d+(s.done[d]?' ✓':locked(d)?' 🔒':'')})}function render(d){cur=d;let x=DAYS[d-1],l=locked(d),c=s.checks[d]||[false,false,false];$('phase').textContent=x.phase;$('day').textContent='Ημέρα '+d+' / '+DAYS.length;$('focus').textContent=x.focus;$('task').textContent=x.task;$('exercise').textContent=x.exercise;$('why').textContent=x.why;let p=Math.round((max()-1)/DAYS.length*100);$('fill').style.width=p+'%';$('percent').textContent=p+'%';$('progressText').textContent='Πρόοδος: '+(max()-1)+' από '+DAYS.length;$('card').classList.toggle('locked',l);document.querySelectorAll('input[data-i]').forEach((el,i)=>{el.checked=c[i];el.disabled=l||!!s.done[d];el.parentElement.classList.toggle('done',c[i])});$('finish').style.display=l||s.done[d]?'none':'block';$('finish').disabled=!c.every(Boolean);$('complete').textContent=l?'🔒 Ολοκλήρωσε πρώτα την προηγούμενη ημέρα.':s.done[d]?'✔ Η ημέρα ολοκληρώθηκε.':'';$('back').disabled=d===1;$('next').disabled=d===DAYS.length||locked(d+1);$('select').value=d}for(let i=1;i<=DAYS.length;i++){$('select').add(new Option('Ημέρα '+i,i))}document.querySelectorAll('input[data-i]').forEach(el=>el.onchange=e=>{let c=s.checks[cur]||[false,false,false];c[+e.target.dataset.i]=e.target.checked;s.checks[cur]=c;save();render(cur)});$('finish').onclick=()=>{s.done[cur]=true;save();labels();render(Math.min(cur+1,DAYS.length))};$('back').onclick=()=>render(cur-1);$('next').onclick=()=>render(cur+1);$('select').onchange=e=>render(+e.target.value);$('reset').onclick=e=>{e.preventDefault();if(confirm('Να μηδενιστεί η πρόοδος;')){s={done:{},checks:{}};save();labels();render(1)}};labels();render(1);</script></body></html>
